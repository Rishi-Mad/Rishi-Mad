name: Generate Snake Animation

on:
  # Run automatically every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on every push to main
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Rishi-Mad
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%234A90E2&color_dots=%23E8F4F8,%23B8D4E8,%235B9BD5,%234A90E2,%232E5C8A
            dist/github-contribution-grid-snake-dark.svg?color_snake=%235B9BD5&color_dots=%231a1a1a,%23333333,%234A90E2,%235B9BD5,%236FA8DC
      
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
