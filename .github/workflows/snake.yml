name: Generate Snake Animation

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Run on every push to main branch
  push:
    branches:
      - main
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v3
      
      # Generate snake animation from GitHub contribution graph
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Rishi-Mad
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark,#f5f5f5,#cccccc,#999999,#666666,#333333
      
      # Move generated files to assets directory
      - name: Move snake files to assets
        run: |
          mkdir -p assets
          mv dist/snake.svg assets/snake.svg
          mv dist/snake-dark.svg assets/snake-dark.svg
      
      # Commit and push the generated files
      - name: Push snake animation to repository
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update snake animation"
          file_pattern: "assets/snake*.svg"
